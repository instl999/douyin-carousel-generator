id: retro_comic
name: 复古双格漫画
description: 参考样例的默认风格——做旧纸张、粗描边、半调网点、暖黄横幅。最稳、最像"老IP动画截图"。

prompt: >-
  1970年代老式印刷连环画/旧动画截图风格，不是现代数码插画。
  手绘黑色描边，线条有粗细变化和轻微抖动，看得出是笔画出来的；
  扁平赛璐璐上色，阴影是硬边的色块，不用柔和渐变；
  颜色明显低饱和、略微发灰发旧，像放了几十年的旧印刷品——
  米黄、赭石、暗墨绿、砖红、灰蓝，避免任何鲜艳明亮的颜色；
  全画面覆盖清晰可见的半调网点（benday dots），近看点阵明显；
  纸张有颗粒和轻微泛黄，边角略脏，套色有一点点错位；
  光线柔和偏暖，像黄昏的白炽灯；
  场景细节扎实、有生活感，拟人化卡通角色造型圆润、表情夸张易读

negative: >-
  现代日系动画作画、新番截图感、干净的数码插画、平滑渐变、高饱和鲜艳配色、
  发光高光、赛璐璐之外的厚涂、写实照片、3D渲染、赛博朋克、冷蓝色调、
  景深虚化过重、现代UI元素、手机截图感、大头特写、空白留白区域

palette: ["#EDE3CC", "#2B2622", "#E9C877", "#7B9A8B", "#B4553F", "#3E5C76"]

page:
  background: "#EDE3CC"
  margin: 46
  gap: 26
  footer: 128

panel:
  border: 5
  border_color: "#2B2622"
  radius: 6
  inner_shadow: true

banner:
  fill: "#E9C877"
  stroke: "#2B2622"
  stroke_width: 3
  text_color: "#1C1A17"
  radius: 18
  font_size: 78
  min_font_size: 32
  top: 34
