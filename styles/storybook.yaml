id: storybook
name: 童话绘本
description: 温暖的水彩绘本风，适合情感、成长、亲子、治愈类选题。

prompt: >-
  手绘水彩绘本插画，柔和的铅笔底稿若隐若现，颜料在纸上自然晕开有水痕，
  暖色系为主，光线像午后斜射的阳光，角色圆润友善，
  背景简洁但有手工质感，整体温柔治愈

negative: 高对比、霓虹、赛博、粗黑描边、写实照片、冷硬工业感

