id: clay_3d
name: 3D黏土质感
description: 圆润可爱的黏土/毛毡质感 + 胶囊形标题，适合亲子、情感、萌宠、生活小技巧。

prompt: >-
  3D黏土定格动画质感，角色和物体像手工捏的软陶，表面有细微指纹和绒毛质感，
  圆润饱满的造型，柔和的影棚布光带轻微次表面散射，浅景深；
  背景是用黏土捏出来的完整微缩场景（房间、街道、楼群、树木和带云朵的天空），
  一直铺到画面顶边；马卡龙色系但不刺眼

negative: 平面插画、粗描边、做旧、水墨、写实人像、恐怖、空白背景、纯色背景

palette: ["#FDF3E7", "#3B322C", "#F2B5A0", "#A8D0C6", "#F7D794", "#B5A7E6"]

page:
  background: "#FDF3E7"
  margin: 50
  gap: 28
  footer: 124

panel:
  border: 0
  radius: 26
  inner_shadow: true

banner:
  shape: pill             # 胶囊形，和黏土的圆润一致
  fill: "#FFFFFF"
  stroke_width: 0
  text_color: "#3B322C"
  font_size: 74
  min_font_size: 30
  top: 38

watermark:
  color: auto

texture:
  grain: 0.02
  vignette: 0.06
  halftone: 0.0
  edge_wear: false

quality:
  max_dead_bands: 3
