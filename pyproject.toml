[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-carousel-generator"
version = "0.4.0"
description = "抖音图文轮播（双格科普漫画）一键生成器"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
dig = "dig.cli:main"

[tool.setuptools]
packages = ["dig", "dig.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
